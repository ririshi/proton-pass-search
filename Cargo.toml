[package]
name = "proton-pass-search"
version = "0.1.0"
edition = "2024"
description = "Search Proton Pass logins from KRunner and GNOME Shell, through pass-cli"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-normalization = "0.1"
wl-clipboard-rs = "0.9"
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
